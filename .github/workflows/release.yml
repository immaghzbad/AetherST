name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.7.0)'
        required: true
        default: '1.7.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.15729638" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version name
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i.bak "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          grep versionName app/build.gradle.kts

      - name: Build debug APKs
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## Build Succeeded" >> $GITHUB_STEP_SUMMARY

          echo "### APK output tree" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -type f -name "*.apk" 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Full outputs tree" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -type f 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="${{ github.workspace }}/release-artifacts"
          mkdir -p "$RELEASE_DIR"

          APK_COUNT=0
          for apk in $(find app/build/outputs -name "*.apk" -type f); do
            BASENAME=$(basename "$apk")
            if [[ "$BASENAME" == *"universal"* ]]; then
              NEW_NAME="AetherY-${VERSION}-universal.apk"
            elif [[ "$BASENAME" == *"arm64-v8a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-arm64-v8a.apk"
            elif [[ "$BASENAME" == *"armeabi-v7a"* ]]; then
              NEW_NAME="AetherY-${VERSION}-armeabi-v7a.apk"
            elif [[ "$BASENAME" == *"x86_64"* ]]; then
              NEW_NAME="AetherY-${VERSION}-x86_64.apk"
            else
              NEW_NAME="AetherY-${VERSION}-${BASENAME}"
            fi
            cp "$apk" "$RELEASE_DIR/$NEW_NAME"
            echo "Copied: $NEW_NAME"
            APK_COUNT=$((APK_COUNT + 1))
          done

          echo "## Artifacts ($APK_COUNT files)" >> $GITHUB_STEP_SUMMARY
          ls -la "$RELEASE_DIR/" >> $GITHUB_STEP_SUMMARY

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APKs found! Debug info:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -o -name "*.aab" 2>&1 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create GitHub Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AetherY v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
